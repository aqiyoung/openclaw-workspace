<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.9;
            color: #1a1a1a;
            background: #ffffff;
            padding: 40px 20px;
        }
        .article-container {
            max-width: 720px;
            margin: 0 auto;
        }
        .article-content h1 {
            font-size: 32px;
            font-weight: 700;
            color: #000000;
            margin: 0 0 24px;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }
        .article-content h2 {
            font-size: 26px;
            font-weight: 600;
            color: #000000;
            margin: 32px 0 20px;
            line-height: 1.4;
            letter-spacing: -0.3px;
        }
        .article-content h3 {
            font-size: 22px;
            font-weight: 600;
            color: #000000;
            margin: 28px 0 18px;
            line-height: 1.5;
        }
        .article-content p {
            margin: 0 0 50px 0;
            font-size: 17px;
            line-height: 1.9;
            color: #374151;
        }
        .article-content strong {
            font-weight: 700;
            color: #000000;
            font-size: 18px;
        }
        .article-content em {
            font-style: italic;
            color: #4b5563;
        }
        .article-content blockquote {
            background: #f9fafb;
            border-left: 4px solid #d1d5db;
            padding: 16px 20px;
            margin: 20px 0;
            color: #4b5563;
            border-radius: 0 8px 8px 0;
        }
        .article-content blockquote p {
            margin: 0;
            font-size: 16px;
            line-height: 1.8;
        }
        .article-content ul, .article-content ol {
            margin: 16px 0;
            padding-left: 24px;
        }
        .article-content li {
            margin: 8px 0;
            line-height: 1.8;
            font-size: 17px;
            color: #374151;
        }
        .article-content code {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: "SF Mono", "Monaco", "Inconsolata", "Fira Code", "Droid Sans Mono", monospace;
            font-size: 14px;
            color: #e11d48;
        }
        .article-content pre {
            background: #1f2937;
            color: #e5e7eb;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            overflow-x: auto;
        }
        .article-content pre code {
            background: none;
            padding: 0;
            color: #e5e7eb;
            font-size: 14px;
            line-height: 1.6;
        }
        .article-content a {
            color: #2563eb;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .article-content a:hover {
            border-bottom-color: #2563eb;
        }
        .article-content hr {
            border: none;
            border-top: 2px solid #e5e7eb;
            margin: 32px 0;
        }
        .article-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 24px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        @media (max-width: 768px) {
            body { padding: 20px 16px; }
            .article-content h1 { font-size: 28px; }
            .article-content h2 { font-size: 24px; }
            .article-content h3 { font-size: 20px; }
            .article-content p { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="article-container">
        <div class="article-content">
            {{content}}
        </div>
    </div>
</body>
</html>
